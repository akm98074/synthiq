name: local-agent

on:
  push:
    paths:
      - "local-agent/**"
      - ".github/workflows/local-agent.yml"
  pull_request:
    paths:
      - "local-agent/**"
      - ".github/workflows/local-agent.yml"

defaults:
  run:
    working-directory: local-agent

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest -q

  wheel:
    needs: test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      - name: Install the wheel in a clean venv and smoke-test the CLI
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/localagent version
      - uses: actions/upload-artifact@v4
        with:
          name: localaiagent-wheel
          path: |
            local-agent/dist/*.whl
            local-agent/install.sh
            local-agent/TESTING.md
            local-agent/UPGRADING.md
