version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: synthiq_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: synthiq
      POSTGRES_PASSWORD: synthiq_dev
      POSTGRES_DB: synthiq
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./api/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synthiq"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: synthiq_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: synthiq_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://synthiq:synthiq_dev@postgres:5432/synthiq
      DATABASE_URL_SYNC: postgresql://synthiq:synthiq_dev@postgres:5432/synthiq
      REDIS_URL: redis://redis:6379
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./api:/app
      - source_storage:/tmp/synthiq-dev
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: synthiq_worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://synthiq:synthiq_dev@postgres:5432/synthiq
      DATABASE_URL_SYNC: postgresql://synthiq:synthiq_dev@postgres:5432/synthiq
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./api:/app
      - source_storage:/tmp/synthiq-dev
    command: python -m arq workers.settings.WorkerSettings

volumes:
  postgres_data:
  source_storage:
