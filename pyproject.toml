[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "localaiagent"
version = "0.1.2"
description = "Local-first personal AI agent: on-device SLMs via Ollama with a Jev-style decision layer"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "pydantic>=2.6",
  "numpy>=1.26",
  "platformdirs>=4.0",
  "psutil>=5.9",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "build>=1.2"]

[project.scripts]
localagent = "localagent.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/localagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
